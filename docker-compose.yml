name: realtime-ml-decision-engine

services:
  # ---- infrastructure --------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: decision-kafka
    ports:
      - "29092:29092" # host access, e.g. for running the producer outside docker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: decision-redis
    ports:
      - "6379:6379" # host access, e.g. for `feast materialize` / redis-cli
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  flink-jobmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: decision-flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081" # Flink's own web UI — job status, watermarks, backpressure
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager

  flink-taskmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: decision-flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2

  # ---- application services ---------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: decision-api
    command: uvicorn src.serving.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  stream-scorer:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: decision-stream-scorer
    command: python -m src.serving.stream_scorer
    ports:
      - "8001:8001" # its own /metrics endpoint (separate process from the API)
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      METRICS_PORT: "8001"
    volumes:
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  producer:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: decision-producer
    command: >
      python -m src.producers.kafka_producer
        --bootstrap-servers kafka:9092
        --speed 600
        --late-rate 0.03
        --loop
    volumes:
      - ./data:/app/data:ro
    depends_on:
      kafka:
        condition: service_healthy

  # ---- monitoring ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: decision-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    container_name: decision-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      # A single mount, not two nested ones: bind-mounting a second host path
      # under a directory that's already part of a read-only mount fails
      # ("read-only file system") because Docker can't create the child
      # mountpoint. The dashboard JSON lives inside this same tree instead,
      # at monitoring/grafana/provisioning/dashboards/json/.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
